on:
  push:
    branches:
      - develop

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: npm install
    - name: Publish
      run: npx vsce publish
      env:
        VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}